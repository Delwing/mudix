# Publishes mudix to npm when a version tag (v*) is pushed.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed. The package
# must have a Trusted Publisher configured on npmjs.com (package Settings →
# Trusted Publisher → GitHub Actions) pointing at this repo and this exact
# workflow filename (publish.yml). `id-token: write` lets npm CLI >= 11.5.1
# exchange GitHub's OIDC token for a short-lived publish token; provenance
# attestation is generated automatically, no `--provenance` flag needed.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - run: yarn test
      # Trusted publishing needs npm CLI >= 11.5.1; Node 22's bundled npm can
      # lag behind that, so upgrade explicitly rather than relying on it.
      - run: npm install -g npm@latest
      # prepublishOnly runs build:lib, so dist-lib is always freshly built.
      - run: npm publish --access public
