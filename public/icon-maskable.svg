<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable needs a filled background; use the mudix teal with a dark glyph, glyph kept in the safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd6bd"/>
      <stop offset="1" stop-color="#3fae97"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M198 214 L246 256 L198 298" fill="none" stroke="#0f1513" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="274" y="285" width="92" height="26" rx="13" fill="#0f1513"/>
</svg>
